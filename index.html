<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>全椒家庭影院 · 系统检测与调试报告</title><link rel="icon" href="assets/ysv-logo.png"><link rel="stylesheet" href="assets/report.css"></head><body>
<main id="home" class="home"><div class="home-content"><img class="home-logo" src="assets/ysv-logo.png" alt="源声视界"><p class="eyebrow">全椒家庭影院</p><h1>系统检测<br>与调试报告</h1><p class="home-intro">把声音的问题找清楚，<br>把下一步怎么处理说明白。</p><div class="home-buttons"><button id="startAuto" class="primary">自动讲解</button><button id="startExplore">项目查看</button></div><p id="homeLength" class="home-meta">22页 · 房间、器材、测量与后续处理</p><p class="home-role">业主自装影院 · 技术检查与系统调试</p></div><figure class="home-photo"><img src="assets/room-front.jpg" alt="本次测量影院的实际现场"><figcaption>实际现场 · 测量日期 2026.10.23</figcaption></figure></main>
<main id="viewer" class="viewer" hidden><nav class="viewer-bar"><button id="homeButton" class="home-link">全椒家庭影院<span>系统检测与调试</span></button><div class="viewer-actions"><button id="chaptersButton">章节目录</button><button id="textButton">讲解文字</button><button id="fullscreen">全屏查看</button></div></nav>
<article class="report-stage" id="stage"><header class="page-heading"><div><p class="eyebrow" id="eyebrow"></p><h1 id="title"></h1><p id="lead" class="lead"></p></div><img class="brand" src="assets/ysv-logo.png" alt="源声视界"></header><div class="page-body"><section class="visual-area"><div class="visual-heading"><h2 id="visualTitle"></h2><div id="visualControls" class="visual-controls"></div></div><div id="visual" class="visual"></div><div id="visualLegend" class="visual-legend"></div><p id="visualNote" class="visual-note"></p></section><aside class="findings" id="findings"></aside></div><footer class="page-source"><p id="source"></p><span id="pageCount"></span></footer></article>
<div id="subtitle" class="subtitle" hidden></div><section class="transport" aria-label="讲解控制"><div class="transport-title"><span id="modeLabel">项目查看</span><strong id="transportTitle"></strong></div><div class="playback-buttons"><button id="previous" aria-label="上一页">上一页</button><button id="backward" aria-label="回看10秒">−10秒</button><button id="playPause" class="play" aria-label="播放讲解"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="playIcon" d="M8 5v14l11-7z"/></svg></button><button id="forward" aria-label="快进10秒">+10秒</button><button id="next" aria-label="下一页">下一页</button></div><div class="timeline"><input id="seek" type="range" min="0" max="100" step="0.001" value="0" aria-label="整套讲解进度"><div class="time-labels"><span id="elapsed">00:00</span><span id="duration">--:--</span></div></div><button id="captions" aria-pressed="false">字幕</button><button id="optionsButton">设置</button></section></main>
<dialog id="chaptersDialog"><div class="dialog-heading"><h2>章节目录</h2><button data-close>关闭</button></div><div id="chaptersList"></div></dialog><dialog id="textDialog"><div class="dialog-heading"><h2 id="textTitle">本页讲解</h2><button data-close>关闭</button></div><div id="textBody"></div></dialog><dialog id="optionsDialog"><div class="dialog-heading"><h2>播放设置</h2><button data-close>关闭</button></div><label>语速<select id="speed"><option value="0.85">稍慢 0.85×</option><option value="1" selected>正常 1×</option><option value="1.2">稍快 1.2×</option><option value="1.5">快速 1.5×</option></select></label><label>音量<input id="volume" type="range" min="0" max="1" step="0.05" value="1"></label><button id="restartAll">从头开始自动讲解</button></dialog><dialog id="endDialog"><div class="dialog-heading"><h2>本次讲解结束</h2><button data-close>关闭</button></div><p>先维修，再检查音箱声路，最后完善房间。</p><div class="end-actions"><button id="endExplore">项目查看</button><button id="endRestart">重新讲解</button></div></dialog>
<audio id="narration" src="assets/audio/full-narration.mp3?v=rew-letters-v2" preload="metadata"></audio><span id="status" class="sr-only" role="status"></span><script src="assets/project-data.js"></script><script src="assets/timeline.js?v=rew-letters-v2"></script><script src="assets/visuals.js"></script><script src="assets/report.js"></script></body></html>
